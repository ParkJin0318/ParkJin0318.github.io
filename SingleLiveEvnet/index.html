app/%5Bslug%5D/page-095f12b7f42691e6.js\"],\"default\"]\n10:Te1d,"])</script><script>self.__next_f.push([1,"\n## SingleLiveEvent와 Event Wrapper란?\n안드로이드 MVVM 패턴에서 SingleLiveEvent 클래스와 Event Wrapper 클래스를 통해 단일 이벤트 발생과 액션을 처리합니다.\n\n## SingleLiveEvent와 Event Wrapper 사용하는 이유는?\nMutableLiveData를 사용하게 된다면, 화면 회전과 같은 생명주기에 관여되는 이벤트가 발생시 LiveData를 여러번 구독하게 되는 문제점을 보완하기 위해 SingleLiveEvent와 Event Wrapper를 사용합니다.\n\n## 사용방법은?\n\n### SingleLiveEvent\n**SingleLiveEvent**는 하나의 observer만 구독 가능합니다.   \n만약, 여러개의 observer를 구독한다면 어느 것이 실행될지 알 수 없습니다.\n\n#### Code\n```kotlin\nclass SingleLiveEvent\u003cT\u003e : MutableLiveData\u003cT?\u003e() {\n\n    private val mPending = AtomicBoolean(false)\n\n    override fun observe(owner: LifecycleOwner, observer: Observer\u003cin T?\u003e) {\n        if (hasActiveObservers()) {\n            Log.w(TAG, \"Multiple observers registered but only one will be notified of changes.\")\n        }\n        // Observe the internal MutableLiveData\n        super.observe(owner, Observer { t -\u003e\n            if (mPending.compareAndSet(true, false)) {\n                observer.onChanged(t)\n            }\n        })\n    }\n\n    @MainThread\n    override fun setValue(@Nullable t: T?) {\n        mPending.set(true)\n        super.setValue(t)\n    }\n\n    /**\n     * Used for cases where T is Void, to make calls cleaner.\n     */\n    @MainThread\n    fun call() {\n        value = null\n    }\n\n    companion object {\n        private const val TAG = \"SingleLiveEvent\"\n    }\n}\n```\n#### viewModel\n```kotlin\n    private val _onPlusEvent = SingleLiveEvent\u003cUnit\u003e()\n    val onPlusEvent: LiveData\u003cUnit\u003e\n    \tget() = _onPlusEvent\n        \n    fun onPlusClick() {\n    \t_onPlusEvent.call()\n    }\n```\n#### Activity\n```kotlin\n  with(viewModel) {\n      onPlusEvent.observe(::getLifecycle) {\n          // ...\n      }\n  }\n```\n\n### Event Wrapper\n**Event Wrapper**는 사용자가 getContentIfNotHandled() 함수와 peekContent() 함수를 선택하여 명시적으로 사용할 수 있다는 장점을 가지고 있습니다.\n\n**getContentIfNotHandled**를 사용하면 중복적인 이벤트 처리를 방지할 수 있고,    \n**peekContent**를 사용하면 이벤트 처리 여부에 상관없이 값을 반환합니다.\n\n#### code\n```kotlin\n/**\n * Used as a wrapper for data that is exposed via a LiveData that represents an event.\n */\nopen class Event\u003cout T\u003e(private val content: T) {\n\n    var hasBeenHandled = false\n        private set // Allow external read but not write\n\n    /**\n     * Returns the content and prevents its use again.\n     */\n    fun getContentIfNotHandled(): T? {\n        return if (hasBeenHandled) {\n            null\n        } else {\n            hasBeenHandled = true\n            content\n        }\n    }\n\n    /**\n     * Returns the content, even if it's already been handled.\n     */\n    fun peekContent(): T = content\n}\n```\n#### ViewModel\n```kotlin\n    private val _onPlusEvent = MutableLiveData\u003cEvent\u003cBoolean\u003e\u003e()\n    val onPlusEvent: LiveData\u003cEvent\u003cBoolean\u003e\u003e\n        get() = _onPlusEvent\n        \n    fun onPlusClick() {\n    \t_onPlusEvent.call()\n    }\n```\n#### Activity\n```kotlin\n  with(viewModel) {\n      onPlusEvent.observe(::getLifecycle) {\n          it.getContentIfNotHandled()?.let {\n              // ...\n          }\n      }\n  }\n```\n\n## 끝내며\nSingleLiveEvent와 Event Wrapper를 모두 사용해봤지만, Event Wrapper가 SingleLiveEvent와 다르게 명시적으로 선택하여 코드를 짤 수 있다는 점이 매력적으로 느껴졌습니다.\n"])</script><script>self.__next_f.push([1,"4:[\"$\",\"article\",null,{\"className\":\"w-full px-4\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex flex-col w-full\",\"children\":[[\"$\",\"$Ld\",null,{\"src\":\"/images/single_live_evnet/thumbnail.jpg\",\"alt\":\"thumbnail\",\"width\":320,\"height\":240,\"className\":\"w-[20rem] object-contain\"}],[\"$\",\"h1\",null,{\"className\":\"text-[3rem] font-bold mt-8 text-content-light dark:text-content-dark\",\"children\":\"SingleLiveEvnet와 Event Wrapper\"}],[\"$\",\"$Le\",null,{\"tags\":[\"Android\",\"SingleLiveEvent\",\"Event Wrapper\
