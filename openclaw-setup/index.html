영 루프\n\nOpenClaw를 꾸준히 쓰게 만든 건 기능보다 **운영 루프**였습니다.\n\n1) 해야 할 일을 Notion에 쌓아둔다\n2) 메인 에이전트가 Notion에서 다음 할 일을 가져온다\n3) 일을 잘게 쪼개서 서브 에이전트에게 위임한다\n4) 결과를 검증하고 Notion 상태를 업데이트한다\n\n여기서 효과가 컸던 포인트는 두 가지입니다.\n\n- 할 일은 한 곳 Notion으로 모은다\n- 상태는 Backlog, Active, Done, Waiting으로 고정한다\n\n\n## 서브 에이전트 역할 구성\n\n역할을 미리 정해두면 병렬 작업이 깔끔해집니다.\n\n- 개발 에이전트\n  - 코드 수정, 리팩터링, 빌드와 테스트\n  - 블로그 글 초안 작성 같은 글 작업도 이 쪽에 위임하는 편입니다\n- 리서치 에이전트\n  - 자료 조사, 링크 수집, 경쟁사 분석\n- 비즈니스 에이전트\n  - 기획 정리, 지표 분석, 가격 전략 초안\n- 퀀트 에이전트\n  - 정해진 루틴성 점검과 스캔\n  - 자세한 운영 방식은 공개 글에서는 생략합니다\n- 디자인 에이전트\n  - 화면 구성 아이디어, 와이어프레임, UI 문서화\n\n작업을 위임할 때는 이렇게 쪼개는 편이 안정적이었습니다.\n\n- 조사\n- 정리\n- 실행\n- 검증\n- 기록\n\n\n## 세팅 단계\n\n### 1 설치와 상태 확인\n\n```bash\nopenclaw gateway status\nopenclaw help\nopenclaw gateway --help\n```\n\n필요하면 재시작합니다.\n\n```bash\nopenclaw gateway restart\n```\n\n\n### 2 기본 설정\n\n중요한 건 무엇이 어디에 남는지 예측 가능하게 만드는 것입니다.\n\n- 작업 디렉토리 고정\n- 로그와 결과물이 남는 위치 고정\n- 위험한 작업은 자동 승인 대신 확인하도록 설정\n\n\n### 3 자주 쓰는 도구 조합\n\n내 세팅에서 자주 등장하는 조합은 아래입니다.\n\n- 웹 페이지 가져오기\n  - 아티클 요약, 문서 확인\n- 셸 실행\n  - 리포 클론, 빌드, 테스트, 포맷\n- 파일 읽기와 쓰기\n  - 글 초안 생성, 수정, 요약 정리\n- 브라우저 릴레이\n  - 로그인과 2FA 때문에 자동화가 막힐 때, 이미 로그인된 브라우저 탭을 붙여서 처리\n- Notion 태스크 스크립트\n  - 태스크 생성, Active 전환, Done 처리\n\n툴을 늘리는 것보다 더 중요한 건 실패했을 때의 복구 전략입니다.\n\n- 타임아웃\n- 재시도\n- 실패 시 사람에게 질문하고 멈추기\n\n\n## 운영 루틴\n\n### 아침 1분 체크\n\n```bash\nopenclaw gateway status\n```\n\n### heartbeat\n\n자동화는 잘 도는 날보다, 죽은 날이 문제입니다.\n그래서 주기적으로 상태를 점검하고 이상하면 알림을 받는 루틴을 둡니다.\n\n\n## 마무리\n\nOpenClaw 세팅에서 가장 중요한 건 도구 목록이 아니라, 멀티 에이전트와 태스크 관리로 운영 루프를 고정하는 것이었습니다.\n한 번 세팅해두면 이후에는 Notion에 할 일을 쌓고, 메인 에이전트가 가져와서 역할별로 분업하는 흐름이 자연스럽게 돌아갑니다.\n"])</script><script>self.__next_f.push([1,"4:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BlogPosting\\\",\\\"headline\\\":\\\"나의 OpenClaw 세팅\\\",\\\"description\\\":\\\"멀티 에이전트와 Notion 태스크 관리로 매일 굴리는 개인용 에이전트 만들기\\\",\\\"datePublished\\\":\\\"2026-02-23\\\",\\
