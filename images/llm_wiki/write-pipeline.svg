<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 330" width="924" height="330" role="img" aria-label="쪽 하나를 쓰는 여섯 단계. 찾기, 처리 방식 정하기, 쓰기는 쓰는 LLM 이 맡고, 기계 검증과 검사 후 커밋은 코드가, 모르는 눈 검토는 작성 대화를 모르는 새 에이전트가 맡는다. 검토가 revise 면 다른 에이전트가 다시 수정하고 최대 2회까지 돈다.">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C9BB0"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E9E6B"/></marker>
    <style>
      .t  { font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
      .hd { font-size: 19px; font-weight: 700; fill: #8C9BB0; letter-spacing: .06em; }
      .lg { font-size: 16px; font-weight: 600; fill: #7A8899; }
      .nw { font-size: 15px; font-weight: 700; fill: #DCE8F8; }
      .nd { font-size: 15px; font-weight: 700; fill: #8C9BB0; }
      .tw { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
      .td { font-size: 21px; font-weight: 700; fill: #22303F; }
      .dw { font-size: 15px; font-weight: 600; fill: #DCE8F8; }
      .dg { font-size: 15px; font-weight: 600; fill: #DDF2E8; }
      .dd { font-size: 15px; font-weight: 600; fill: #55647A; }
      .fb { font-size: 16px; font-weight: 700; fill: #2E9E6B; }
      .hk { font-size: 15px; font-weight: 700; fill: #7A8899; }
    </style>
  </defs>

  <rect width="924" height="330" rx="14" fill="#F4F6F8"/>
  <text class="t hd" x="28" y="44">쪽 하나를 쓰는 여섯 단계</text>

  <rect x="560" y="30" width="18" height="18" rx="5" fill="#296FCF"/>
  <text class="t lg" x="586" y="45">쓰는 LLM</text>
  <rect x="680" y="30" width="18" height="18" rx="5" fill="#FFFFFF" stroke="#D3DCE7" stroke-width="2"/>
  <text class="t lg" x="706" y="45">코드</text>
  <rect x="762" y="30" width="18" height="18" rx="5" fill="#2E9E6B"/>
  <text class="t lg" x="788" y="45">새 에이전트</text>

  <text class="t hk" x="462" y="72" text-anchor="middle">쓰는 순간 훅이 돌림</text>

  <!-- 1 찾기 -->
  <rect x="28" y="84" width="128" height="150" rx="12" fill="#296FCF"/>
  <text class="t nw" x="42" y="108">1</text>
  <text class="t tw" x="92" y="156" text-anchor="middle">찾기</text>
  <text class="t dw" x="92" y="198" text-anchor="middle">위키를 검색해</text>
  <text class="t dw" x="92" y="220" text-anchor="middle">기존 쪽 읽기</text>

  <!-- 2 처리 방식 -->
  <rect x="176" y="84" width="128" height="150" rx="12" fill="#296FCF"/>
  <text class="t nw" x="190" y="108">2</text>
  <text class="t tw" x="240" y="142" text-anchor="middle">처리 방식</text>
  <text class="t tw" x="240" y="168" text-anchor="middle">정하기</text>
  <text class="t dw" x="240" y="198" text-anchor="middle">새 쪽·더하기·</text>
  <text class="t dw" x="240" y="220" text-anchor="middle">어긋남·언급만</text>

  <!-- 3 쓰기 -->
  <rect x="324" y="84" width="128" height="150" rx="12" fill="#296FCF"/>
  <text class="t nw" x="338" y="108">3</text>
  <text class="t tw" x="388" y="156" text-anchor="middle">쓰기</text>
  <text class="t dw" x="388" y="198" text-anchor="middle">틀을 복사해</text>
  <text class="t dw" x="388" y="220" text-anchor="middle">근거 링크 달기</text>

  <!-- 4 기계 검증 -->
  <rect x="472" y="84" width="128" height="150" rx="12" fill="#FFFFFF" stroke="#D3DCE7" stroke-width="2"/>
  <text class="t nd" x="486" y="108">4</text>
  <text class="t td" x="536" y="142" text-anchor="middle">기계</text>
  <text class="t td" x="536" y="168" text-anchor="middle">검증</text>
  <text class="t dd" x="536" y="198" text-anchor="middle">규칙·짜임·</text>
  <text class="t dd" x="536" y="220" text-anchor="middle">원본 대조</text>

  <!-- 5 모르는 눈 -->
  <rect x="620" y="84" width="128" height="150" rx="12" fill="#2E9E6B"/>
  <text class="t nw" x="634" y="108">5</text>
  <text class="t tw" x="684" y="142" text-anchor="middle">모르는 눈</text>
  <text class="t tw" x="684" y="168" text-anchor="middle">검토</text>
  <text class="t dg" x="684" y="198" text-anchor="middle">쪽과 근거만</text>
  <text class="t dg" x="684" y="220" text-anchor="middle">받아 읽기</text>

  <!-- 6 커밋 -->
  <rect x="768" y="84" width="128" height="150" rx="12" fill="#FFFFFF" stroke="#D3DCE7" stroke-width="2"/>
  <text class="t nd" x="782" y="108">6</text>
  <text class="t td" x="832" y="142" text-anchor="middle">검사 후</text>
  <text class="t td" x="832" y="168" text-anchor="middle">커밋</text>
  <text class="t dd" x="832" y="198" text-anchor="middle">겹침·링크 확인</text>
  <text class="t dd" x="832" y="220" text-anchor="middle">목록 다시 만듦</text>

  <g stroke="#8C9BB0" stroke-width="2.5" fill="none" marker-end="url(#g)">
    <path d="M158,159 H172"/><path d="M306,159 H320"/><path d="M454,159 H468"/><path d="M602,159 H616"/><path d="M750,159 H764"/>
  </g>

  <path d="M684,236 V262 Q684,274 672,274 H400 Q388,274 388,262 V240"
        stroke="#2E9E6B" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#v)"/>
  <text class="t fb" x="536" y="304" text-anchor="middle">revise 면 다른 에이전트가 수정, 최대 2회</text>
</svg>
