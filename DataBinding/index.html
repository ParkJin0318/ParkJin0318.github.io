ge-4244951db7551f4e.js\"],\"default\"]\n10:Tcc2,"])</script><script>self.__next_f.push([1,"\n# DataBinding이란?\nDataBinding은 안드로이드 Jetpack 라이브러리 중 하나인 데이터 결합 라이브러리입니다.   \nXML과 Data를 연결하여 유지관리와 성능향상, 메모리 누수 및 NULL 포인터 예외를 방지 할 수 있습니다.\n\n# DataBinding 사용 방법\n### 빌드 환경 변경\n\nbuild.gradle\n```kotlin\nandroid {\n    ...\n    buildFeatures {\n            dataBinding = true\n    }\n    ...\n}\n\ndependencies {\n    implementation \"androidx.lifecycle:lifecycle-extensions:버전정보\"\n}\n\n```\ndataBinding 요소를 app 모듈 build.gradle 파일에 추가해줍니다.   \nLiveData를 사용하기 위해 lifecycle 라이브러리도 추가해줍니다.\n\n### Layout XML 변경\n\nactivity_main.xml\n```xml\n\u003c?xml version=\"1.0\" encoding=\"utf-8\"?\u003e\n\u003clayout\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\n    tools:context=\".MainActivity\"\u003e\n\n    \u003cdata\u003e\n        \u003cvariable\n            name=\"activity\"\n            type=\"com.example.databinding.MainActivity\" /\u003e\n    \u003c/data\u003e\n\n    \u003candroidx.constraintlayout.widget.ConstraintLayout\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"match_parent\"\u003e\n\n        \u003cTextView\n            android:layout_width=\"wrap_content\"\n            android:layout_height=\"wrap_content\"\n            android:text=\"@{activity.text}\"\n            app:layout_constraintBottom_toBottomOf=\"parent\"\n            app:layout_constraintEnd_toEndOf=\"parent\"\n            app:layout_constraintStart_toStartOf=\"parent\"\n            app:layout_constraintTop_toTopOf=\"parent\" /\u003e\n\n    \u003c/androidx.constraintlayout.widget.ConstraintLayout\u003e\n\u003c/layout\u003e\n```\n\nlayout 태크로 감싸고, data와 variable 태그를 통해 activity라는 이름의 결합 변수를 만들어줍니다.   \n그리고 TextView의 text와 결합 변수의 text 변수를 결합 표현식으로 연결해줍니다.\n\n\n### Activity 변경\n\nMainActivity.kt\n```kotlin\nclass MainActivity : AppCompatActivity() {\n\n    lateinit var binding: ActivityMainBinding\n\n    val text = MutableLiveData\u003cString\u003e()\n\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        performDataBinding()\n        \n        text.value = \"Hello DataBinding!\"\n    }\n\n    private fun performDataBinding() {\n        binding = DataBindingUtil.setContentView(this, R.layout.activity_main)\n        binding.activity = this\n        binding.lifecycleOwner = this\n        binding.executePendingBindings()\n    }\n}\n```\nactivty_main.xml 파일을 layout 태크로 감싸면 ActivityMainBinding이라는 클래스가 자동으로 생성됩니다.\n\nDataBindingUtil.setContentView()를 통해 xml과 연결해줍니다.\n\nMutableLiveData 타입의 text 변수의 value 값이 변경될 때마다 자동으로 xml의 TextView도 변경될 것입니다.\n\n# 끝내며\nMVVM 디자인 패턴을 사용할 때 주로 사용했었는데 필요없는 View 쪽의 코드가 줄어들고, Data가 변경될 때마다 UI가 변경되어 편리했습니다.\n\n그리고 BindingAdapter를 같이 이용하면 추가로 필요한 Binding 속성을 만들 수 있어서 코드 유지관리와 가독성 측면에서 편리했습니다.\n"])</script><script>self.__next_f.push([1,"4:[\"$\",\"article\",null,{\"className\":\"w-full px-4\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex flex-col w-full\",\"children\":[[\"$\",\"$Ld\",null,{\"src\":\"/images/data_binding/thumbnail.jpg\",\"alt\":\"thumbnail\",\"width\":320,\"height\":240,\"className\":\"w-[20rem] object-contain\"}],[\"$\",\"h1\",null,{\"className\":\"text-[3rem] font-bold mt-8 text-content-light dark:text-content-dark\",\"children\":\"간단한 DataBinding 사용 방법\"}],[\"$\",\"$Le\",null,{\"tags\":[\"Android\",\"DataBinding\"],\"className\":\"w-full mt-3\"}],[\"$\",\"span\",null,{\"className\":\"text-[0.9rem] font-normal text-content-secondary-light dark:text-content-secondary-dark mt-4\",\"children\":\"2021.01.18\"}]]}],[\"$\",\"div\",null,{\"className\":\"mt-16\",\"children\":[\"$\",\"$Lf\",null,{\"content\":\"$10\"}]}],[\"$\",\"$L11\",null,{}]]}]\na:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"1\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"2\",{\
