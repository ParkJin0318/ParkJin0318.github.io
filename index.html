<!DOCTYPE html><html lang="ko"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" href="/_next/static/css/cd7adc997659c2f4.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/_next/static/chunks/webpack-629fcb4683d87d38.js"/><script src="/_next/static/chunks/fd9d1056-e070525407d48905.js" async=""></script><script src="/_next/static/chunks/117-867137cad741731d.js" async=""></script><script src="/_next/static/chunks/main-app-8ae15ca423c45924.js" async=""></script><script src="/_next/static/chunks/878-3f3b7455e66154e5.js" async=""></script><script src="/_next/static/chunks/app/page-981a550f8361a76f.js" async=""></script><script src="/_next/static/chunks/731-29444b5e989e86b5.js" async=""></script><script src="/_next/static/chunks/app/layout-882d235f1351cb91.js" async=""></script><title>Jin Blog</title><meta name="description" content="Jin&#x27;s personal blog"/><link rel="icon" href="/favicon.ico"/><script src="/_next/static/chunks/polyfills-42372ed130431b0a.js" noModule=""></script></head><body class="bg-background-light dark:bg-background-dark text-content-light dark:text-content-dark"><script src="/_next/static/chunks/webpack-629fcb4683d87d38.js" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0]);self.__next_f.push([2,null])</script><script>self.__next_f.push([1,"1:HL[\"/_next/static/css/cd7adc997659c2f4.css\",\"style\"]\n"])</script><script>self.__next_f.push([1,"2:I[2846,[],\"\"]\n4:I[2696,[\"878\",\"static/chunks/878-3f3b7455e66154e5.js\",\"931\",\"static/chunks/app/page-981a550f8361a76f.js\"],\"default\"]\nd:I[9734,[\"878\",\"static/chunks/878-3f3b7455e66154e5.js\",\"731\",\"static/chunks/731-29444b5e989e86b5.js\",\"185\",\"static/chunks/app/layout-882d235f1351cb91.js\"],\"ThemeProvider\"]\ne:I[6090,[\"878\",\"static/chunks/878-3f3b7455e66154e5.js\",\"731\",\"static/chunks/731-29444b5e989e86b5.js\",\"185\",\"static/chunks/app/layout-882d235f1351cb91.js\"],\"default\"]\nf:I[4707,[],\"\"]\n10:I[6423,[],\"\"]\n12:I[1060,[],\"\"]\n5:T152a,"])</script><script>self.__next_f.push([1,"\n단순한 이유로 코틀린 코루틴을 도입하고 싶을 수도 있고, 혹은 기존 프로젝트가 RxJava로 잘 구현되어 있고 문제 없이동작하는데,  \n\n과연 리소스를 들여서 코틀린 코루틴을 도입해야 할까 같은 의문점을 가질 수 있습니다.  \n동일한 생각을 했던 사람으로서 코루틴 코틀린을 도입하면 좋은 명확한 이유에 대해 정리해봤습니다.\n\n## 비동기 연산을 처리하는 다양한 방법\n\n### 이상적인 형태\n\n```kotlin\nfun main() {\n    view.showProgressBar()\n\n    val user = getUserFromApi() // API\n    val posting = getPostingFromApi() // API\n\n    view.hideProgressBar()\n    view.showUI(user, posting)\n}\n```\n\n\"API로부터 사용자 정보와 게시글 정보를 가져와서 UI에 노출하는 로직\"을 구현할 경우, 위와 같이 구현하는 것이 가장 읽기 쉬운 이상적인 형태일 것 같습니다.\n\n다만, Android 환경에서는 아래와 같은 문제점이 있습니다.\n- UI 스레드가 장시간 블로킹 되어 ANR로크래시가 발생할 것입니다.\n\n다른 방법들을 살펴보면,\n\n### Thread 이용\n\n```kotlin\nfun main() {\n    view.showProgressBar()\n\n    var user: User? = null\n    var posting: Posting? = null\n\n    val userThread = thread {\n        user = getUserFromApi() // API\n    }\n    val postingThread = thread {\n        posting = getPostingFromApi() // API\n    }\n\n    userThread.join()\n    postingThread.join()\n\n    view.hideProgressBar()\n    view.showUI(user, posting)\n}\n```\n\n블로킹 가능한 스레드를 생성하여 처리하고, 이후 UI 스레드로 전환하여 처리하는 것이 가장 직관적인 방법입니다.\n\n다만, 다음과 같은 문제점이 있습니다.\n- 스레드를 멈출 수 있는 방법이 없어 메모리 누수로 이어질 수 있습니다.\n- 스레드를 많이 생성하면 비용이 많이 듭니다.\n- 스레드를 자주 전환할 경우, 복잡도를 증가시키며 관리하기 어렵습니다.\n\n### Callback 이용\n\n```kotlin\nfun main() {\n    view.showProgressBar()\n\n    getUserFromApi { user -\u003e // API\n        getPostingFromApi { posting -\u003e // API\n\n            view.hideProgressBar()\n            view.showUI(user, posting)\n        }\n    }\n}\n```\n\n함수를 논블로킹으로 만들고, 함수의 작업이 끝났을 때 호출될 콜백 함수를 넘겨주는 콜백으로 처리하는 방법도 있습니다.\n\n다만, 다음과 같은 문제점이 있습니다.\n- 콜백 또한 중간에 작업을 취소할 수 없습니다.\n- 콜백 구조에서는 사용자 정보와 게시글 정보를 병렬로 동시에 처리할 수 없습니다.\n- 들여쓰기가 많아져 코드가 읽기 어려워지는 콜백 지옥이 발생할 수 있습니다.\n- 작업의 순서를 제어하기 힘듭니다.\n\n### RxJava 이용\n\n```kotlin\nfun main() {\n    view.showProgressBar()\n\n    val userSingle = Single.fromCallable { getUserFromApi() } // API\n        .subscribeOn(Schedulers.io())\n\n    val postingSingle = Single.fromCallable { getPostingFromApi() } // API\n        .subscribeOn(Schedulers.io())\n\n    disposables += Single.zip(\n        userSingle,\n        postingSingle,\n        { user, posting -\u003e Pair(user, posting) }\n    )\n        .observeOn(AndroidSchedulers.mainThread())\n        .subscribe { (user, posting) -\u003e\n\n            view.hideProgressBar()\n            view.showUI(user, posting)\n        }\n}\n```\n\nRxJava를 통해 메모리 누수가 없고, 취소가 가능하며, 스레드 또한 적절하게 사용할 수 있습니다.\n\n다만, 다음과 같은 문제점이 있습니다.\n- RxJava는 구현하기에 아주 복잡하며, 앞서 봤던 이상적인 코드의 형태와 완전히 다릅니다.\n- RxJava의 Single, Observable 등으로 Wrapping 해야하므로 상당한 코드량이 변경되어야 할 수 있습니다.\n- 병렬 처리를 위해 Pair와 같은 불필요한 처리가 필요할 수 있습니다.\n\n### Coroutine 이용\n\n```kotlin\nfun main() {\n    view.showProgressBar()\n\n    scope.launch {\n        val user = async { getUserFromApi() } // API\n        val posting = async { getPostingFromApi() } // API\n\n        view.hideProgressBar()\n        view.showUI(user.awit(), posting.awit())\n    }\n}\n```\n\n코루틴을 통해 기존 코드의 큰 변경 없이 이상적인 형태의 코드와 비슷하게 작성 가능하며,\n메모리 누수가 없고, 취소가 가능하게 사용 가능합니다.\n\n코루틴 사용하면 스레드를 블로킹 하지 않고, 코루틴을 중단합니다.\n\n코루틴의 중단은 데이터가 오는 걸 기다릴 때, 스레드를 블로킹 하는 대신 코루틴을 잠시 멈추는 방식으로 동작합니다.\n\n코루틴이 잠시 멈춰 있는 동안, UI 스레드는 다른 작업을 할 수 있고, 데이터가 준비되면 코루틴은 다시 UI 스레드를 할당받아 이전에 멈춘 지점부터 다시 시작됩니다.\n\n스레드를 명시적으로 생성하면 비용이 크고, 스레드를 위한 메모리 또한 할당 되어야 합니다.\n\n해당 스레드가 응답을 기다릴 때마다 블로킹하고 있다면 비용이 많이 발생하겠지만, 코루틴을 통해 스레드를 블로킹하지 않고 코루틴을 중단하여 비교적 저렴한 비용으로 처리가 가능합니다.\n\n추가적으로, KMP 환경에서도 코루틴을 지원하기에 앞으로 코루틴을 활용할 방안이 더 많아질 것 같습니다 🙂\n"])</script><script>self.__next_f.push([1,"6:T902,"])</script><script>self.__next_f.push([1,"\n## Operator Zip\nRxJava를 사용하면서 대부분 **여러 개의 스트림을 동시에 호출**하여 **결과 값을 한 번에 처리**하고 싶은 경우에 **Zip**이라는 Operator를 사용할 것이다.   \n하지만 Zip은 모든 스트림의 결과가 발행이 되었을 때 실행되지만, 모든 스트림이 **동시에 호출되는가에 대해서**는 생각해봐야 한다.   \n\n## 올바르지 않은 처리\n``` kotlin\nval firstWord = Observable.fromCallable { getFirstWord() }\nval lastWord = Observable.fromCallable { getLastWord() }\n\nObservable.zip(firstWord, lastWord) { first, last -\u003e\n\t\"$first $last!\"\n}.subscribeOn(Schedulers.io())\n\t.observeOn(AndroidSchedulers.mainThread())\n\t.subscribe { Log.e(\"result word\", it) }\n```\n\n\u003cimg src=\"/images/rx_java_zip/result_bad.png\" alt=\"database\" width=\"80%\"/\u003e\n\n예상대로라면 동시에 호출이 되어 동시에 호출이 되어야 하지만, Log를 찍어보면 **순차적으로 호출**이 되고 있는 것을 확인할 수 있다.   \n물론 ```subscribeOn```에서 스레드를 io로 설정을 했으니 당연히 병렬로 처리되어야 하는 것이 아닌가 라고 생각할 수 있지만, Zip에 대한 스레드를 io로 설정한 것이지 **각각의 스트림에 대해서는 스레드를 지정해주지 않았기에** 위와 같은 결과를 확인할 수 있다.\n\n## 올바른 처리\n``` kotlin\nval firstWord = Observable.fromCallable { getFirstWord() }\n\t.subscribeOn(Schedulers.io())\nval lastWord = Observable.fromCallable { getLastWord() }\n\t.subscribeOn(Schedulers.io())\n\nObservable.zip(firstWord, lastWord) { first, last -\u003e\n\t\"$first $last!\"\n}.observeOn(AndroidSchedulers.mainThread())\n\t.subscribe { Log.e(\"result word\", it) }\n```\n\u003cimg src=\"/images/rx_java_zip/result_good.png\" alt=\"database\" width=\"80%\"/\u003e\n\n각각의 스트림에 스레드를 지정해주니 예상한대로 **동시에 호출**되는 것을 확인 할 수 있다.   \n위 코드에서는 Zip에서 큰 역할을 하고 있지 않아 따로 스레드를 지정해주고 있지 않지만, Zip의 역할이 커진다면 스레드를 지정해주는 것이 좋다.\n\n## 끝내며\nZip을 사용할 때 순차적으로 호출하는 것을 의도한 경우를 제외하고는 각각의 스트림에 스레드를 지정해주는 것을 잊지 말자! 😊\n"])</script><script>self.__next_f.push([1,"7:Tba8,"])</script><script>self.__next_f.push([1,"\n# Apollo란?\nGraphQL을 사용하기 편리하게 만들어주는 라이브러리입니다.\n\n# Apollo 사용방법\nhttps://rickandmortyapi.com/graphql\n\n\nGraphQL을 사용해보기 위해 테스트 서버로 위 주소를 사용하겠습니다.\n\n### Apollo Client 설치\n```\nbrew install apollo-cli\n```\nMacOS의 경우 brew를 통해 apollo Client를 설치해주면 편리합니다.\n혹은 npm을 통해 설치도 가능합니다.\n\n### Android 빌드환경 설정\n\n**classpath 추가**\n```kotlin\nbuildscript { \n    ...\n    dependencies {\n        ...\n        classpath \"com.apollographql.apollo:apollo-gradle-plugin:2.5.2\"\n    }\n}\n```\n**plugin 추가**\n```kotlin\nplugins {\n    ...\n    id 'com.apollographql.apollo'\n}\n```\n\n**generateKotlinModels 활성화**\n```kotlin\nandroid {\n    ...\n    apollo {\n        generateKotlinModels = true\n    }\n}\n```\n\n**라이브러리 추가**\n```kotlin\ndependencies {\n    ...\n    implementation \"com.apollographql.apollo:apollo-runtime:2.5.2\"\n    implementation \"com.apollographql.apollo:apollo-android-support:2.5.2\"\n}\n```\n\n\n### GraphQL Package 생성\n\u003cimg src=\"/images/apollo/package.png\" alt=\"database\" width=\"50%\"/\u003e\n안드로이드 스튜디오에서 위 이미지와 같이 java 패키지와 비슷하게 main에 GraphQL 패키지를 만들어주면 됩니다.\n\n### schema.json 다운로드\n\u003cimg src=\"/images/apollo/schema.png\" alt=\"database\" width=\"80%\"/\u003e\n```\napollo schema:download --endpoint=https://rickandmortyapi.com/graphql schema.json\n```\n안드로이드 스튜디오 내부 터미널에서 위 명령어를 입력해주면 방금 만든 GraphQL 패키지에 _schema.json_ 파일이 저장됩니다.\n\n```\napollo schema:download --endpoint=http://localhost:8080/graphql --header=\"Authorization: Bearer \u003ctoken\u003e\"\n```\n서버에서 token을 요청할 경우 위와 같이 header 넣어주시면 됩니다.\n\n### Query 파일 생성\n\u003cimg src=\"/images/apollo/query.png\" alt=\"database\" width=\"50%\"/\u003e\n\n**result.graphql**\n```graphql\nquery Result {\n  characters {\n    results {\n      name\n      species\n      gender\n      image\n    }\n  }\n}\n```\n파일을 생성하고 쿼리를 입력해줍니다.\n그리고 Rebuild Project를 꼭 해줍시다.\n\n### Request 요청\n\n```kotlin\nval apolloClient = ApolloClient.builder()\n        .serverUrl(\"https://rickandmortyapi.com/graphql/\")\n        .build()\n\napolloClient.query(ResultQuery())\n    .enqueue(object : ApolloCall.Callback\u003cResultQuery.Data\u003e() {\n        override fun onResponse(response: Response\u003cResultQuery.Data\u003e) {\n            ...\n        }\n\n        override fun onFailure(e: ApolloException) {\n            ...\n        }\n    })\n```\n\n# 끝내며\nRestAPI 라이브러리인 Retrofit2에 비해 초기 설정이 복잡하지만, RxJava나 코루틴을 같이 사용가능하며, Request 요청하는 부분이 간단하고, 필요한 데이터만 받을 수 있어 효율적으로 느껴졌습니다.\n\n전체 코드는 [Github](https://github.com/ParkJin0318/GraphQL-Sample_Android)를 참고해주세요.\n"])</script><script>self.__next_f.push([1,"8:T1116,"])</script><script>self.__next_f.push([1,"\n# Room이란?\n안드로이드 앱의 내부 DB로 Jetpack 라이브러리 중 하나입니다.   \nSQLite에 대한 추상화 레이어를 제공하여 원활한 데이터베이스 엑세스를 제공합니다.\n\n\u003cimg src=\"/images/room/database.png\" alt=\"database\" width=\"50%\"/\u003e\n- Database: 데이터베이스 홀더를 포함하며 앱의 지속적인 관계형 데이터의 기본 연결을 위한 기본 액세스 포인트 역할을 합니다.\n- DAO: 데이터베이스에 액세스하는 데 사용되는 메서드가 포함되어 있습니다.\n- Entites: 데이터베이스 내의 테이블을 나타냅니다.\n\n# Room 사용방법\n간단하게 메모장으로 사용할 수 있는 DB를 만들어보겠습니다.\n\n### 빌드 환경 설정\nbuild.gradle\n```kotlin\nplugins {\n    ...\n    id 'kotlin-kapt'\n}\n```\nkotlin kapt 플러그인을 추가해줍니다.\n\n```kotlin\ndependencies {\n    ...\n    kapt \"androidx.room:room-compiler:버전정보\"\n    testImplementation \"androidx.room:room-testing:버전정보\"\n    implementation \"androidx.room:room-runtime:버전정보\"\n}\n```\nroom 관련 라이브러리를 추가해줍니다.\n\n### Entity 생성\nMemoEntity.kt\n```kotlin\nimport androidx.room.Entity\nimport androidx.room.PrimaryKey\n\n@Entity(tableName = \"memo_table\")\ndata class MemoEntity(\n    @PrimaryKey(autoGenerate = true)\n    val idx: Int,\n    val title: String,\n    val content: String\n)\n```\n메모의 컬럼 정보를 저장할 테이블 객체를 만들어줍니다.\n\n### Dao 생성\nMemoDao.kt\n```kotlin\nimport androidx.room.*\n\n@Dao\ninterface MemoDao {\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    fun insertMemo(entity: MemoEntity)\n\n    @Query(\"SELECT * FROM memo_table\")\n    fun getAllMemo(): List\u003cMemoEntity\u003e\n\n    @Update(onConflict = OnConflictStrategy.REPLACE)\n    fun updateMemo(entity: MemoEntity)\n\n    @Query(\"DELETE FROM memo_table WHERE idx=:idx\")\n    fun deleteMemo(idx : Int)\n\n    @Query(\"DELETE FROM memo_table\")\n    fun deleteAllMemo()\n}\n```\n데이터베이스에 접근 가능한 쿼리를 제공해주는 Dao를 만들어줍니다.\n\n### Database 생성\n```kotlin\n\nimport android.content.Context\nimport androidx.room.Database\nimport androidx.room.Room\nimport androidx.room.RoomDatabase\n\n@Database(entities = [MemoEntity::class], version = 1, exportSchema = false)\nabstract class MemoDatabase : RoomDatabase() {\n\n    abstract fun memoDao() : MemoDao\n\n    companion object {\n        private var INSTANCE : MemoDatabase? = null\n\n        fun getInstance(context: Context) : MemoDatabase? {\n            if (INSTANCE == null) {\n                synchronized(MemoDatabase::class) {\n                    INSTANCE = Room.databaseBuilder(context.applicationContext,\n                        MemoDatabase::class.java, \"memo-db\")\n                        .fallbackToDestructiveMigration()\n                        .allowMainThreadQueries()\n                        .build()\n                }\n            }\n            return INSTANCE\n        }\n    }\n}\n```\n데이터베이스를 엑세스 할 수 있으며, Entity와 버전 정보를 관리해줄 Database를 만들어줍니다.\n\n### Room 적용\n```kotlin\nclass MainActivity : AppCompatActivity() {\n\n    private lateinit var memoDao: MemoDao\n\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_main)\n        \n        accessDatabase()\n        Thread(insertMemo).start()\n    }\n    \n    private fun accessDatabase() {\n        val memoDatabase = MemoDatabase.getInstance(this)!!\n        memoDao = memoDatabase.memoDao()\n    }\n\n    private val insertMemo = Runnable {\n        val entity = MemoEntity(\n            idx = 0,\n            title = \"Room 사용방법\",\n            content = \"정말 쉬워요!\"\n        )\n        memoDao.insertMemo(entity)\n    }\n}\n```\n위와 같은 방식으로 Thread를 이용하여 쉽게 사용할 수 있습니다. 그리고\n\n\n```kotlin\nrunOnUiThread { \n    // ...\n}\n```\nrunOnUiThread를 사용하면 Thread 사용할 때 뷰를 안전하게 접근할 수 있습니다.\n\n# 끝내며\n확실히 SQLite에 비해 Room은 쿼리 유효성을 컴파일 중에 검사할 수 있어서 편리했습니다.    \n이번 글에서는 Room을 그냥 사용해봤는데, Room은 다양한 반환 유형을 지원하기 때문에 RxJava나 코루틴 등을 이용한 비동기처리가 가능합니다.\n"])</script><script>self.__next_f.push([1,"9:Tcc2,"])</script><script>self.__next_f.push([1,"\n# DataBinding이란?\nDataBinding은 안드로이드 Jetpack 라이브러리 중 하나인 데이터 결합 라이브러리입니다.   \nXML과 Data를 연결하여 유지관리와 성능향상, 메모리 누수 및 NULL 포인터 예외를 방지 할 수 있습니다.\n\n# DataBinding 사용 방법\n### 빌드 환경 변경\n\nbuild.gradle\n```kotlin\nandroid {\n    ...\n    buildFeatures {\n            dataBinding = true\n    }\n    ...\n}\n\ndependencies {\n    implementation \"androidx.lifecycle:lifecycle-extensions:버전정보\"\n}\n\n```\ndataBinding 요소를 app 모듈 build.gradle 파일에 추가해줍니다.   \nLiveData를 사용하기 위해 lifecycle 라이브러리도 추가해줍니다.\n\n### Layout XML 변경\n\nactivity_main.xml\n```xml\n\u003c?xml version=\"1.0\" encoding=\"utf-8\"?\u003e\n\u003clayout\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\n    tools:context=\".MainActivity\"\u003e\n\n    \u003cdata\u003e\n        \u003cvariable\n            name=\"activity\"\n            type=\"com.example.databinding.MainActivity\" /\u003e\n    \u003c/data\u003e\n\n    \u003candroidx.constraintlayout.widget.ConstraintLayout\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"match_parent\"\u003e\n\n        \u003cTextView\n            android:layout_width=\"wrap_content\"\n            android:layout_height=\"wrap_content\"\n            android:text=\"@{activity.text}\"\n            app:layout_constraintBottom_toBottomOf=\"parent\"\n            app:layout_constraintEnd_toEndOf=\"parent\"\n            app:layout_constraintStart_toStartOf=\"parent\"\n            app:layout_constraintTop_toTopOf=\"parent\" /\u003e\n\n    \u003c/androidx.constraintlayout.widget.ConstraintLayout\u003e\n\u003c/layout\u003e\n```\n\nlayout 태크로 감싸고, data와 variable 태그를 통해 activity라는 이름의 결합 변수를 만들어줍니다.   \n그리고 TextView의 text와 결합 변수의 text 변수를 결합 표현식으로 연결해줍니다.\n\n\n### Activity 변경\n\nMainActivity.kt\n```kotlin\nclass MainActivity : AppCompatActivity() {\n\n    lateinit var binding: ActivityMainBinding\n\n    val text = MutableLiveData\u003cString\u003e()\n\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        performDataBinding()\n        \n        text.value = \"Hello DataBinding!\"\n    }\n\n    private fun performDataBinding() {\n        binding = DataBindingUtil.setContentView(this, R.layout.activity_main)\n        binding.activity = this\n        binding.lifecycleOwner = this\n        binding.executePendingBindings()\n    }\n}\n```\nactivty_main.xml 파일을 layout 태크로 감싸면 ActivityMainBinding이라는 클래스가 자동으로 생성됩니다.\n\nDataBindingUtil.setContentView()를 통해 xml과 연결해줍니다.\n\nMutableLiveData 타입의 text 변수의 value 값이 변경될 때마다 자동으로 xml의 TextView도 변경될 것입니다.\n\n# 끝내며\nMVVM 디자인 패턴을 사용할 때 주로 사용했었는데 필요없는 View 쪽의 코드가 줄어들고, Data가 변경될 때마다 UI가 변경되어 편리했습니다.\n\n그리고 BindingAdapter를 같이 이용하면 추가로 필요한 Binding 속성을 만들 수 있어서 코드 유지관리와 가독성 측면에서 편리했습니다.\n"])</script><script>self.__next_f.push([1,"a:Tec4,"])</script><script>self.__next_f.push([1,"\n## Retrofit이란?\n안드로이드에서 API서버와 통신하기 위한 방법으로 HttpUrlConnection, Volley, OkHttp, Retrofit2 등이 존재합니다.    \n그중에서 Retrofit2는 구현하기 쉽고 성능과 가독성이 좋다는 장점을 가지고 있습니다.\n\n## 사용방법은?\n이번 글에서는 Retrofit2를 이용하여 자신의 Github 정보를 불러오는 방법을 정리했습니다.\n\n### 라이브러리 추가\n```kotlin\nimplementation 'com.squareup.retrofit2:retrofit:버전정보'\nimplementation 'com.squareup.retrofit2:converter-gson:버전정보'\n```\nretrofit 관련 라이브러리를 build.gradle 파일에 추가해줍니다.\n\n### 인터넷 권한 추가\n```xml\n...\n\u003cuses-permission android:name=\"android.permission.INTERNET\" /\u003e\n...\n```\n인터넷을 사용할 수 있도록 유저 권한을 추가해줍니다.\n\n### Retrofit Builder 생성\n```kotlin\nobject RetrofitBuilder {\n    var api : API\n\n    init {\n        val retrofit = Retrofit.Builder()\n            .baseUrl(\"https://api.github.com/\")\n            .addConverterFactory(GsonConverterFactory.create())\n            .build()\n\n        api = retrofit.create(API::class.java)\n    }\n}\n```\n코틀린의 object 키워드를 이용하여 싱글톤으로 생성해줍니다.\n\n_baseUrl_에는 이번 글에서 사용할 깃허브 api 주소를 넣고, _addConverterFactory_에는 GsonConverter를 추가하여 JSON 형식을 DTO Class 형식으로 자동변환해줍니다.\n\n### DTO Class 생성\nhttps://api.github.com/users/유저아이디\n\n유저아이디 부분에 자신의 깃허브 아이디를 입력하여 요청하면 아래 사진과 같이 JSON 형식으로 데이터가 표시됩니다.\n\n\u003cimg src=\"/images/retrofit/api_spec.png\" alt=\"api_spec\" width=\"50%\"/\u003e\n\n```kotlin\ndata class UserInfo(\n    @SerializedName(\"login\")\n    val userId: String,\n    val followers: Int,\n    val following: Int\n)\n```\n많은 유저 정보 중에서 유저 아이디와 팔로우, 팔로잉 정보만 안드로이드 앱에 표시해보겠습니다.   \nJSON 데이터를 받아올 UserInfo라는 DTO 클래스를 생성해줍니다.\n\n변수의 이름을 JSON의 키 값과 이름을 맞춰 매핑해주거나 @SerializedName을 통해 매핑해줄 수 있습니다.\n\n### API Interface 생성\n``` kotlin\ninterface API {\n    @GET(\"users/유저아이디\") // baseUrl + \"user/유저아이디\"\n    fun getUserInfo(): Call\u003cUserInfo\u003e\n}\n```\nAPI 인터페이스를 생성 후 어노테이션을 이용하여 HTTP Method인 POST, GET, PUT, DELETE를 설정해줍니다.\n\n유저아이디 부분에 자신의 Gihub 아이디를 입력해줍니다.\n\n### 요청 보내기\n```kotlin\nimport androidx.appcompat.app.AppCompatActivity\nimport android.os.Bundle\nimport android.util.Log\nimport retrofit2.Call\nimport retrofit2.Callback\nimport retrofit2.Response\n\nclass MainActivity : AppCompatActivity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_main)\n\n        RetrofitBuilder.api.getUserInfo().enqueue(object : Callback\u003cUserInfo\u003e {\n            override fun onResponse(call: Call\u003cUserInfo\u003e, response: Response\u003cUserInfo\u003e) {\n                val userInfo = response.body()\n                Log.d(\"response\", \"${userInfo?.login} ${userInfo?.followers} ${userInfo?.following}\")\n            }\n            override fun onFailure(call: Call\u003cUserInfo\u003e, t: Throwable) {\n                Log.d(\"error\", t.message.toString())\n            }\n        })\n\n    }\n}\n```\n\n## 끝내며\nRetrofit2는 다른 안드로이드 서버통신 라이브러리에 비해 GsonConverter와 SimpleXmlConverter를 사용하여 JSON과 XML을 쉽게 파싱할 수 있고, 인터페이스를 통해 API를 관리할 수 있다는 점이 편리하게 느껴졌습니다.\n"])</script><script>self.__next_f.push([1,"b:Tdfc,"])</script><script>self.__next_f.push([1,"\n## 의존성 주입(Dependency Injection)이란?\n내부에서 객체를 생성하는 것이 아닌 외부에서 객체를 생성하여 의존성을 주입하는 것입니다.\n\n## 의존성 주입을 사용하는 이유는?\n- 코드의 재사용성 향상 및 간결화에 도움을 줍니다.\n- 객체의 생성과 사용을 분리시키고 종속된 코드를 줄여줍니다.\n- 코드의 유연성과 확장성이 높아집니다.\n\n## 의존성 주입 사용방법은?\n안드로이드에서 의존성 주입을 도와주는 대표적인 라이브러리로 Dagger2, Koin, Hilt 등이 있습니다.    \n이번 글에서는 **Koin**을 통해 의존성 주입을 구현해보겠습니다. 특히 Koin은 학습하기 쉽고, Kotlin에 최적화된 라이브러리입니다.\n\n### 라이브러 추가\n```kotlin\nimplementation \"org.koin:koin-androidx-scope:버전정보\"\nimplementation \"org.koin:koin-androidx-viewmodel:버전정보\"\nimplementation \"org.koin:koin-androidx-ext:버전정보\"\n```\n먼저 gradle에 라이브러리를 추가해줍니다.\n\n### 예제 코드 입력\n```kotlin\ninterface NameRepository {\n\n    fun getName() : String\n}\n\nclass NameRepositoryImpl : NameRepository {\n\n    override fun getName(): String = \"My name is Koin\"\n}\n\nclass GetNameUseCase(private val nameRepository: NameRepository) {\n\n    fun getName() = nameRepository.getName()\n}\n\nclass MainActivity : AppCompatActivity() {\n\n    private val getNameUseCase: GetNameUseCase by inject()\n\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_main)\n\n        text.text = getNameUseCase.getName()\n    }\n}\n```\n_NameRepository_ 인터페이스와 이것을 구현하는 _NameRepositoryImpl_를 만들어줍니다.   \n그리고 인터페이스를 파라미터로 받는 _GetNameUseCase_를 만들고, Activity에 Inject하여 주입해줍니다.\n\n### 모듈 추가\n```kotlin\nval module = module {\n    single\u003cNameRepository\u003e { NameRepositoryImpl() }\n    single { GetNameUseCase(get()) }.bind(NameRepositoryImpl::class)\n}\n```\nkoin 모듈을 이용하여 앞에서 만든 클래스들을 koin dsl 키워드를 통해 생성해줍니다.\n\n- single : 한 번 생성하면 앱이 살아있는 동안 계속 사용 가능한 객체를 생성\n- factory : Inject 할 때마다 인스턴스 생성\n- viewModel : viewModel 인스턴스를 생성\n- bind : 지정된 컴포넌트의 타입을 추가적으로 바인딩\n- get : 생성된 객체 중에 알맞은 객체를 주입\n- applicationContext : Context를 주입\n\n### 모듈 선언\n```kotlin\nclass Application : Application() {\n\n    override fun onCreate() {\n        super.onCreate()\n\n        startKoin {\n            androidLogger()\n            androidContext(this@Application)\n            modules(module)\n        }\n    }\n}\n\n \u003capplication\n        android:name=\".Application\"\n        android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"true\"\n        android:theme=\"@style/AppTheme\"\u003e\n        ...\n```\n앱이 시작할 때 koin이 동작할 수 있도록 Application 클래스를 생성해주고 Manifest.xml 파일에 정의해줍니다.\n\n## 끝내며\n기존에 의존성 주입을 Dagger2로 학습하여 어렵게 느껴졌지만, Koin을 통해 다시 학습하니 코드를 관리하기 쉽고 유용하다고 느껴졌습니다.  \nDagger2가 어렵게 느껴진다면 Koin을 먼저 학습하는 것도 도움이 될 것 같습니다.\n"])</script><script>self.__next_f.push([1,"c:Te1d,"])</script><script>self.__next_f.push([1,"\n## SingleLiveEvent와 Event Wrapper란?\n안드로이드 MVVM 패턴에서 SingleLiveEvent 클래스와 Event Wrapper 클래스를 통해 단일 이벤트 발생과 액션을 처리합니다.\n\n## SingleLiveEvent와 Event Wrapper 사용하는 이유는?\nMutableLiveData를 사용하게 된다면, 화면 회전과 같은 생명주기에 관여되는 이벤트가 발생시 LiveData를 여러번 구독하게 되는 문제점을 보완하기 위해 SingleLiveEvent와 Event Wrapper를 사용합니다.\n\n## 사용방법은?\n\n### SingleLiveEvent\n**SingleLiveEvent**는 하나의 observer만 구독 가능합니다.   \n만약, 여러개의 observer를 구독한다면 어느 것이 실행될지 알 수 없습니다.\n\n#### Code\n```kotlin\nclass SingleLiveEvent\u003cT\u003e : MutableLiveData\u003cT?\u003e() {\n\n    private val mPending = AtomicBoolean(false)\n\n    override fun observe(owner: LifecycleOwner, observer: Observer\u003cin T?\u003e) {\n        if (hasActiveObservers()) {\n            Log.w(TAG, \"Multiple observers registered but only one will be notified of changes.\")\n        }\n        // Observe the internal MutableLiveData\n        super.observe(owner, Observer { t -\u003e\n            if (mPending.compareAndSet(true, false)) {\n                observer.onChanged(t)\n            }\n        })\n    }\n\n    @MainThread\n    override fun setValue(@Nullable t: T?) {\n        mPending.set(true)\n        super.setValue(t)\n    }\n\n    /**\n     * Used for cases where T is Void, to make calls cleaner.\n     */\n    @MainThread\n    fun call() {\n        value = null\n    }\n\n    companion object {\n        private const val TAG = \"SingleLiveEvent\"\n    }\n}\n```\n#### viewModel\n```kotlin\n    private val _onPlusEvent = SingleLiveEvent\u003cUnit\u003e()\n    val onPlusEvent: LiveData\u003cUnit\u003e\n    \tget() = _onPlusEvent\n        \n    fun onPlusClick() {\n    \t_onPlusEvent.call()\n    }\n```\n#### Activity\n```kotlin\n  with(viewModel) {\n      onPlusEvent.observe(::getLifecycle) {\n          // ...\n      }\n  }\n```\n\n### Event Wrapper\n**Event Wrapper**는 사용자가 getContentIfNotHandled() 함수와 peekContent() 함수를 선택하여 명시적으로 사용할 수 있다는 장점을 가지고 있습니다.\n\n**getContentIfNotHandled**를 사용하면 중복적인 이벤트 처리를 방지할 수 있고,    \n**peekContent**를 사용하면 이벤트 처리 여부에 상관없이 값을 반환합니다.\n\n#### code\n```kotlin\n/**\n * Used as a wrapper for data that is exposed via a LiveData that represents an event.\n */\nopen class Event\u003cout T\u003e(private val content: T) {\n\n    var hasBeenHandled = false\n        private set // Allow external read but not write\n\n    /**\n     * Returns the content and prevents its use again.\n     */\n    fun getContentIfNotHandled(): T? {\n        return if (hasBeenHandled) {\n            null\n        } else {\n            hasBeenHandled = true\n            content\n        }\n    }\n\n    /**\n     * Returns the content, even if it's already been handled.\n     */\n    fun peekContent(): T = content\n}\n```\n#### ViewModel\n```kotlin\n    private val _onPlusEvent = MutableLiveData\u003cEvent\u003cBoolean\u003e\u003e()\n    val onPlusEvent: LiveData\u003cEvent\u003cBoolean\u003e\u003e\n        get() = _onPlusEvent\n        \n    fun onPlusClick() {\n    \t_onPlusEvent.call()\n    }\n```\n#### Activity\n```kotlin\n  with(viewModel) {\n      onPlusEvent.observe(::getLifecycle) {\n          it.getContentIfNotHandled()?.let {\n              // ...\n          }\n      }\n  }\n```\n\n## 끝내며\nSingleLiveEvent와 Event Wrapper를 모두 사용해봤지만, Event Wrapper가 SingleLiveEvent와 다르게 명시적으로 선택하여 코드를 짤 수 있다는 점이 매력적으로 느껴졌습니다.\n"])</script><script>self.__next_f.push([1,"13:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"build
