ontent-light dark:text-content-dark"><script src="/_next/static/chunks/webpack-629fcb4683d87d38.js" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0]);self.__next_f.push([2,null])</script><script>self.__next_f.push([1,"1:HL[\"/_next/static/css/3e29b3c3adab0b56.css\",\"style\"]\n"])</script><script>self.__next_f.push([1,"2:I[2846,[],\"\"]\n4:I[8636,[\"931\",\"static/chunks/app/page-0e9375ae0ef64867.js\"],\"default\"]\n8:I[9734,[\"731\",\"static/chunks/731-ac1a68db58e8f292.js\",\"185\",\"static/chunks/app/layout-be189ddcece6cb27.js\"],\"ThemeProvider\"]\n9:I[6090,[\"731\",\"static/chunks/731-ac1a68db58e8f292.js\",\"185\",\"static/chunks/app/layout-be189ddcece6cb27.js\"],\"default\"]\na:I[4707,[],\"\"]\nb:I[6423,[],\"\"]\nd:I[1060,[],\"\"]\n5:T1802,"])</script><script>self.__next_f.push([1,"\n요즘은 “한 번 만들어 놓고 끝”인 자동화보다, **매일 굴리는 개인용 에이전트**가 더 가치가 큰 것 같습니다.\n\n다만 에이전트를 실제로 쓰기 시작하면 아래 문제를 자주 만나게 됩니다.\n\n- 어디까지 자동화했는지 기억이 안 남\n- 툴 연결이 끊겨서 흐름이 깨짐\n- 로그가 흩어져서 원인 파악이 늦음\n- 결국 귀찮아져서 안 쓰게 됨\n\n이 글은 OpenClaw를 **개발자 개인용 운영 도구**로 세팅하는 방식(설치 → 기본 설정 → 툴 연결 → 운영 루틴)을 정리한 내용입니다.\n\n\u003e OpenClaw는 버전/환경에 따라 명령어나 설정 파일이 조금씩 다를 수 있습니다.\n\u003e 정확한 커맨드는 `openclaw help` 출력 기준으로 맞춰주세요.\n\n\n## 왜 OpenClaw인가\n\n개인용 에이전트에 기대하는 형태는 대체로 비슷합니다.\n\n- 텔레그램 같은 채널에서 할 일을 던지면, 에이전트가 알아서 처리\n- 필요하면 서브에이전트를 여러 개 띄워서 병렬로 조사/작성/수정\n- 작업 기록이 파일로 남아서 다음날 다시 이어가기 쉬움\n\nOpenClaw는 이걸 “운영 가능한 형태”로 묶어주는 쪽에 강점이 있습니다.\n\n\n## OpenClaw 구성요소(개념 정리)\n\n[다이어그램: 메인 에이전트 / 서브에이전트 / 툴 / 워크스페이스 파일]\n\n### 1) 메인 에이전트(Main agent)\n\n- 사용자가 대화 채널로 요청을 넣는 창구\n- 작업을 쪼개고, 실행을 위임하고, 결과를 합칩니다.\n\n### 2) 서브에이전트(Subagent)\n\n- “조사만”, “초안 작성만”, “코드 수정만” 같이 역할을 좁혀서 수행하는 실행 유닛\n- 메인 에이전트가 `sessions_spawn` 같은 방식으로 생성하고, 결과는 메인에게 돌아옵니다.\n\n### 3) 툴(Tools)\n\n- 에이전트가 실제로 할 수 있는 “손”\n- 파일 읽기/쓰기, 셸 실행, 웹 페이지 가져오기, 메시지 전송 같은 기능들이 여기에 포함됩니다.\n\n### 4) 워크스페이스 파일(= 파일 기반 메모리)\n\n대화는 휘발되기 쉽습니다. 반대로 파일은 남습니다.\n\n- `shared/MEMORY.md`: 장기 기억(중요한 결정/정리)\n- `memory/YYYY-MM-DD.md`: 일일 로그\n- `TOOLS.md`, `AGENTS.md`: 운영 규칙/툴 사용 가이드\n\n이 구조를 잡아두면 “다음에도 같은 실수”가 줄어듭니다.\n\n\n## 핵심: 멀티 에이전트 + Notion 태스크 관리\n\nOpenClaw를 꾸준히 쓰게 만든 건 기능보다 **운영 루프**였습니다.\n\n운영 루프는 단순합니다.\n\n1) 해야 할 일을 Notion에 쌓아둔다\n2) 메인 에이전트가 Notion에서 다음 할 일을 가져온다\n3) 일을 잘게 쪼개서 서브에이전트에게 위임한다\n4) 결과를 검증하고 Notion 상태를 업데이트한다\n\n여기서 효과가 컸던 포인트는 두 가지입니다.\n\n- **태스크의 단일 출처(SSOT)**: 할 일은 한 곳(Notion)으로 모읍니다.\n- **상태 전이 규칙**: Backlog → Active → Done(또는 Waiting) 처럼 규칙을 고정합니다.\n\n[이미지: Notion 태스크 DB 예시(Backlog/Active/Done)]\n\n\n## 운영 루틴 (아침 1분 + heartbeat)\n\n운영은 “한 번 설치”보다 “매일 굴리기”가 더 중요합니다.\n\n### 1) 아침: 상태 체크(1분)\n\n- 게이트웨이가 살아있는지\n- 메시지 채널 연결이 정상인지\n\n```bash\nopenclaw gateway status\n```\n\n필요하면 재시작:\n\n```bash\nopenclaw gateway restart\n```\n\n### 2) heartbeat: 죽었을 때 알아차리기\n\n자동화는 “잘 도는 날”보다 “죽은 날”이 문제입니다.\n그래서 최소한 아래 중 하나는 두는 편이 좋습니다.\n\n- 주기적으로 상태를 점검하고, 비정상이면 알림\n- (선택) 일정 주기로 재시작\n\n[이미지: 알림 채널(텔레그램)로 상태 알림이 오는 예시]\n\n\n## 세팅 단계 (설치 → 기본 설정 → 툴 연결)\n\n### 0) 워크스페이스부터 잡기\n\n워크스페이스에는 아래 파일을 먼저 두는 편이 좋습니다.\n\n- `TOOLS.md`: 사용할 수 있는 도구/스킬, 경로, 금지 패턴\n- `AGENTS.md`: 에이전트 운영 규칙(위임 기준, 금지 행동 등)\n- `shared/MEMORY.md`: 장기 기억\n- `memory/YYYY-MM-DD.md`: 일일 로그\n\n\n### 1) 설치/검증\n\n환경마다 설치 방법은 달라질 수 있어서, 검증 커맨드를 기준점으로 둡니다.\n\n```bash\nopenclaw gateway status\nopenclaw help\nopenclaw gateway --help\n```\n\n\n### 2) 기본 설정(작업 디렉토리/로그/권한)\n\n중요한 건 “무엇이 어디에 남는지”를 예측 가능하게 만드는 것입니다.\n\n- 작업 디렉토리 고정\n- 로그/결과물이 남는 위치 고정\n- 위험한 작업은 자동 승인 대신 확인하도록 설정\n\n\n### 3) 자주 쓰는 툴 조합\n\n- 웹 페이지 가져오기: 조사/리서치\n- 셸 실행: 빌드/테스트/포맷\n- 파일 읽기/쓰기: 초안/리포트/로그 남기기\n\n툴을 늘리는 것보다 더 중요한 건, 실패했을 때의 복구 전략입니다.\n\n- 타임아웃\n- 재시도\n- 실패 시 사람에게 질문하고 멈추기\n\n\n### 4) 브라우저 Relay(확장 프로그램)로 로그인 문제 줄이기\n\n브라우저 자동화는 실전에 들어가면 로그인/2FA에서 막히는 경우가 많습니다.\n\n이럴 때는 격리된 자동화 브라우저 대신, 이미 로그인된 Chrome 탭을 붙이는 방식이 운영이 쉬운 편입니다.\n\n[이미지: Chrome 확장 프로그램에서 Relay 뱃지 ON 상태]\n\n\n## 실전 팁\n\n### 1) 작업을 더 작게 쪼개기\n\n한 번에 크게 시키면 검증이 어렵고 실패하면 원인이 흐립니다.\n\n- 조사 → 정리 → 실행 → 검증 → 기록\n\n이 흐름으로 쪼개고, 단계별로 서브에이전트를 붙이면 안정성이 올라갑니다.\n\n### 2) 결과를 “파일로 남기기”\n\n채팅에만 남기면 다음날 다시 처음부터 설명해야 합니다.\n\n- 규칙은 `AGENTS.md`\n- 툴 사용법은 `TOOLS.md`\n- 결론/교훈은 `shared/MEMORY.md`\n- 작업 흔적은 `memory/YYYY-MM-DD.md`\n\n이렇게 정리해두면 다음 작업은 “파일 읽고 이어서”가 됩니다.\n"])</script><script>self.__next_f.push([1,"6:T1223,"])</script><script>self.__next_f.push([1,"\n사내에서 코드와 관련된 질문들이 자주 발생합니다.\n\n\"이 기능은 어떻게 동작하나요?\", \"이 값은 어디서 설정되나요?\" 같은 질문들에 매번 개발자가 직접 답변하는 것은 비효율적입니다.\n\n이러한 반복적인 질문에 자동으로 답변할 수 있는 RAG(Retrieval Augmented Generation) 기반의 코드베이스 Q\u0026A 봇을 만들어 보았습니다.\n\n## RAG란?\n\nRAG는 LLM이 답변을 생성할 때, 외부 데이터베이스에서 관련 정보를 검색하여 컨텍스트로 제공하는 방식입니다.\n\n일반적인 LLM은 학습된 데이터만으로 답변하기 때문에 최신 정보나 특정 도메인 지식에 대한 답변이 부정확할 수 있습니다.\n\nRAG를 활용하면 우리 코드베이스의 실제 코드를 기반으로 정확한 답변을 생성할 수 있습니다.\n\n## 시스템 아키텍처\n\n### 기술 스택\n\n| 구성요소 | 기술 |\n|---------|-----|\n| API 서버 | FastAPI + Uvicorn |\n| 벡터 DB | ChromaDB |\n| 임베딩 모델 | Jina Code v2 (코드 특화 모델) |\n| 리랭킹 | FlashRank |\n| LLM | OpenAI API (gpt-4o-mini) |\n| 연동 | n8n + Slack |\n\n### 전체 흐름\n\n```\n1. 인덱싱 (최초 1회)\n   소스 코드 → 파일 읽기 → 언어별 청킹 → 임베딩 → ChromaDB 저장\n\n2. 질의 처리 (실시간)\n   사용자 질문\n   → 한국어면 영어로 번역\n   → 벡터 검색 (top 100)\n   → 리랭킹 (top 30)\n   → LLM 답변 생성\n   → 슬랙 응답\n```\n\n## 주요 구현 내용\n\n### 1. 코드 인덱싱\n\n코드를 효과적으로 검색하려면 적절한 단위로 분할해야 합니다.\n\nLangChain의 언어별 텍스트 분할기를 사용하여 함수, 클래스 등의 논리적 단위를 최대한 보존했습니다.\n\n```python\nfrom langchain.text_splitter import RecursiveCharacterTextSplitter, Language\n\nsplitter = RecursiveCharacterTextSplitter.from_language(\n    language=Language.KOTLIN,\n    chunk_size=1000,\n    chunk_overlap=200\n)\n```\n\n각 청크에는 파일 경로, 모듈명, 언어 정보 등의 메타데이터를 함께 저장하여 출처 추적이 가능하도록 했습니다.\n\n### 2. 검색 및 리랭킹\n\n단순 벡터 검색만으로는 정확도가 부족할 수 있습니다.\n\n먼저 벡터 검색으로 100개의 후보를 가져온 뒤, FlashRank로 리랭킹하여 상위 30개를 최종 선택하는 2단계 검색을 구현했습니다.\n\n```python\n# 1단계: 벡터 검색\ndocs = vectorstore.similarity_search_with_score(query, k=100)\n\n# 2단계: 리랭킹\nreranked = reranker.rerank(query, docs, top_n=30)\n```\n\n한국어 질문의 경우, 영어로 변환 후 검색하면 코드 검색 정확도가 높아집니다.\n\n### 3. 비개발자 친화적 답변 생성\n\n이 봇의 핵심 목표는 PM, 디자이너 등 비개발자도 코드 관련 질문에 대한 답변을 쉽게 이해할 수 있도록 하는 것입니다.\n\n프롬프트에서 다음 규칙을 강조했습니다:\n\n- 클래스명, 함수명, 변수명 등 기술 용어 사용 금지\n- \"회원가입 화면에서 로딩이 표시됩니다\" 같은 일상적인 표현 사용\n- 불확실한 내용에는 \"정확한 내용은 담당 개발자 확인이 필요해요\" 안내\n\n## 슬랙 연동\n\n슬랙과의 연동은 n8n을 통해 구현했습니다.\n\nn8n이 슬랙 메시지를 수신하면 Code Bot API로 요청을 보내고, 응답을 다시 슬랙 스레드에 전달합니다.\n\n외부 접근을 위해 Cloudflare Tunnel을 사용하여 로컬 서버를 HTTPS로 노출했습니다.\n\n### 실제 사용 예시\n\n아래는 실제 슬랙에서 봇을 사용하는 예시입니다:\n\n![슬랙 사용 예시](/images/rag_code_base_bot/slack_example.png)\n\n질문에 대해 결론, 목록, 상세 설명, 참고 코드까지 구조화된 답변을 제공합니다.\n\n## 보안 고려사항\n\n코드베이스에는 민감한 정보가 포함될 수 있으므로, 다음과 같은 보안 규칙을 적용했습니다:\n\n- API 키, 시크릿 키, 토큰 관련 질문 차단\n- 서버 주소, API URL 관련 질문 차단\n- 인증 정보, 비밀번호 관련 질문 차단\n\n차단된 질문에 대해서는 담당 팀에 문의하도록 안내합니다.\n\n## 마무리\n\nRAG 기반 코드베이스 Q\u0026A 봇을 통해 반복적인 코드 관련 질문에 자동으로 답변할 수 있게 되었습니다.\n\n비개발자들도 개발자의 도움 없이 코드 동작 방식을 이해할 수 있어, 커뮤니케이션 비용이 크게 줄었습니다.\n\n물론 LLM의 한계로 인해 100% 정확한 답변을 보장할 수는 없지만, 초기 정보 탐색 단계에서 충분히 유용하게 활용되고 있습니다.\n"])</script><script>self.__next_f.push([1,"7:T152a,"])</script><script>self.__next_f.push([1,"\n단순한 이유로 코틀린 코루틴을 도입하고 싶을 수도 있고, 혹은 기존 프로젝트가 RxJava로 잘 구현되어 있고 문제 없이동작하는데,  \n\n과연 리소스를 들여서 코틀린 코루틴을 도입해야 할까 같은 의문점을 가질 수 있습니다.  \n동일한 생각을 했던 사람으로서 코루틴 코틀린을 도입하면 좋은 명확한 이유에 대해 정리해봤습니다.\n\n## 비동기 연산을 처리하는 다양한 방법\n\n### 이상적인 형태\n\n```kotlin\nfun main() {\n    view.showProgressBar()\n\n    val user = getUserFromApi() // API\n    val posting = getPostingFromApi() // API\n\n    view.hideProgressBar()\n    view.showUI(user, posting)\n}\n```\n\n\"API로부터 사용자 정보와 게시글 정보를 가져와서 UI에 노출하는 로직\"을 구현할 경우, 위와 같이 구현하는 것이 가장 읽기 쉬운 이상적인 형태일 것 같습니다.\n\n다만, Android 환경에서는 아래와 같은 문제점이 있습니다.\n- UI 스레드가 장시간 블로킹 되어 ANR로크래시가 발생할 것입니다.\n\n다른 방법들을 살펴보면,\n\n### Thread 이용\n\n```kotlin\nfun main() {\n    view.showProgressBar()\n\n    var user: User? = null\n    var posting: Posting? = null\n\n    val userThread = thread {\n        user = getUserFromApi() // API\n    }\n    val postingThread = thread {\n        posting = getPostingFromApi() // API\n    }\n\n    userThread.join()\n    postingThread.join()\n\n    view.hideProgressBar()\n    view.showUI(user, posting)\n}\n```\n\n블로킹 가능한 스레드를 생성하여 처리하고, 이후 UI 스레드로 전환하여 처리하는 것이 가장 직관적인 방법입니다.\n\n다만, 다음과 같은 문제점이 있습니다.\n- 스레드를 멈출 수 있는 방법이 없어 메모리 누수로 이어질 수 있습니다.\n- 스레드를 많이 생성하면 비용이 많이 듭니다.\n- 스레드를 자주 전환할 경우, 복잡도를 증가시키며 관리하기 어렵습니다.\n\n### Callback 이용\n\n```kotlin\nfun main() {\n    view.showProgressBar()\n\n    getUserFromApi { user -\u003e // API\n        getPostingFromApi { posting -\u003e // API\n\n            view.hideProgressBar()\n            view.showUI(user, posting)\n        }\n    }\n}\n```\n\n함수를 논블로킹으로 만들고, 함수의 작업이 끝났을 때 호출될 콜백 함수를 넘겨주는 콜백으로 처리하는 방법도 있습니다.\n\n다만, 다음과 같은 문제점이 있습니다.\n- 콜백 또한 중간에 작업을 취소할 수 없습니다.\n- 콜백 구조에서는 사용자 정보와 게시글 정보를 병렬로 동시에 처리할 수 없습니다.\n- 들여쓰기가 많아져 코드가 읽기 어려워지는 콜백 지옥이 발생할 수 있습니다.\n- 작업의 순서를 제어하기 힘듭니다.\n\n### RxJava 이용\n\n```kotlin\nfun main() {\n    view.showProgressBar()\n\n    val userSingle = Single.fromCallable { getUserFromApi() } // API\n        .subscribeOn(Schedulers.io())\n\n    val postingSingle = Single.fromCallable { getPostingFromApi() } // API\n        .subscribeOn(Schedulers.io())\n\n    disposables += Single.zip(\n        userSingle,\n        postingSingle,\n        { user, posting -\u003e Pair(user, posting) }\n    )\n        .observeOn(AndroidSchedulers.mainThread())\n        .subscribe { (user, posting) -\u003e\n\n            view.hideProgressBar()\n            view.showUI(user, posting)\n        }\n}\n```\n\nRxJava를 통해 메모리 누수가 없고, 취소가 가능하며, 스레드 또한 적절하게 사용할 수 있습니다.\n\n다만, 다음과 같은 문제점이 있습니다.\n- RxJava는 구현하기에 아주 복잡하며, 앞서 봤던 이상적인 코드의 형태와 완전히 다릅니다.\n- RxJava의 Single, Observable 등으로 Wrapping 해야하므로 상당한 코드량이 변경되어야 할 수 있습니다.\n- 병렬 처리를 위해 Pair와 같은 불필요한 처리가 필요할 수 있습니다.\n\n### Coroutine 이용\n\n```kotlin\nfun main() {\n    view.showProgressBar()\n\n    scope.launch {\n        val user = async { getUserFromApi() } // API\n        val posting = async { getPostingFromApi() } // API\n\n        view.hideProgressBar()\n        view.showUI(user.awit(), posting.awit())\n    }\n}\n```\n\n코루틴을 통해 기존 코드의 큰 변경 없이 이상적인 형태의 코드와 비슷하게 작성 가능하며,\n메모리 누수가 없고, 취소가 가능하게 사용 가능합니다.\n\n코루틴 사용하면 스레드를 블로킹 하지 않고, 코루틴을 중단합니다.\n\n코루틴의 중단은 데이터가 오는 걸 기다릴 때, 스레드를 블로킹 하는 대신 코루틴을 잠시 멈추는 방식으로 동작합니다.\n\n코루틴이 잠시 멈춰 있는 동안, UI 스레드는 다른 작업을 할 수 있고, 데이터가 준비되면 코루틴은 다시 UI 스레드를 할당받아 이전에 멈춘 지점부터 다시 시작됩니다.\n\n스레드를 명시적으로 생성하면 비용이 크고, 스레드를 위한 메모리 또한 할당 되어야 합니다.\n\n해당 스레드가 응답을 기다릴 때마다 블로킹하고 있다면 비용이 많이 발생하겠지만, 코루틴을 통해 스레드를 블로킹하지 않고 코루틴을 중단하여 비교적 저렴한 비용으로 처리가 가능합니다.\n\n추가적으로, KMP 환경에서도 코루틴을 지원하기에 앞으로 코루틴을 활용할 방안이 더 많아질 것 같습니다 🙂\n"])</script><script>self.__next_f.push([1,"e:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"ANG_lgIP8rGDmST9mI8un\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"\"],\"initialTree\":[\"\",{\"children\":[\"__PAGE__\",{}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"posts\":[{\"slug\":\"openclaw-setup\",\"category\":\"개발\",\"title\":\"OpenClaw 세팅 방식 (개인용 에이전트 운영 루틴)\",\"description\":\"멀티 에이전트 + Notion 태스크 관리로 “매일 굴리는” 개인용 에이전트 만들기\",\"createdAt\":\"2026.02.23\",\"tags\":[\"Agent\",\"Automation\",\"OpenClaw\",\"LLM\"],\"content\":\"$5\"},{\"slug\":\"rag-code-base-bot\",\"category\":\"개발\",\"title\":\"RAG 기반 코드베이스 Q\u0026A 봇 만들기\",\"description\":\"사내 코드 정책 질문을 자동화하는 슬랙 봇 개발기\",\"createdAt\":\"2026.02.01\",\"tags\":[\"RAG\",\"LLM\",\"Python\"],\"content\":\"$6\"},{\"slug\":\"coroutine-introduction\",\"category\":\"개발\",\"title\":\"Kotlin Coroutine을 도입하면 좋은 이유\",\"description\":\"Kotlin Coroutine을 도입하면 좋은 이유에 대해여\",\"createdAt\":\"2023.08.25\",\"tags\":[\"Android\",\"Coroutine\"],\"content\":\"$7\"}]}],null],null],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/3e29b3c3adab0b56.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"ko\",\"suppressHydrationWarning\":true,\"children\":[\"$\",\"body\",null,{\"className\":\"min-h-screen bg-background-light dark:bg-background-dark text-content-light dark:text-content-dark\",\"children\":[\"$\",\"$L8\",null,{\"children\":[[\"$\",\"$L9\",null,{}],[\"$\",\"main\",null,{\"children\":[
